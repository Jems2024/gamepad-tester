<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <clipPath id="circle">
      <circle cx="256" cy="256" r="256"/>
    </clipPath>
    <clipPath id="saltire-clip">
      <path d="M 0,0 L 512,512 M 512,0 L 0,512"/>
    </clipPath>
  </defs>
  <g clip-path="url(#circle)">
    <!-- Base Blue -->
    <rect width="512" height="512" fill="#012169"/>
    <!-- White saltire (St Andrew) -->
    <path d="M 0,0 L 512,512 M 512,0 L 0,512" stroke="#FFFFFF" stroke-width="85"/>
    <!-- Red saltire (St Patrick) -->
    <path d="M 0,0 L 256,256" stroke="#C8102E" stroke-width="28" stroke-dasharray="0" transform="translate(10, -5)"/>
    <path d="M 512,512 L 256,256" stroke="#C8102E" stroke-width="28" stroke-dasharray="0" transform="translate(-10, 5)"/>
    <path d="M 512,0 L 256,256" stroke="#C8102E" stroke-width="28" stroke-dasharray="0" transform="translate(10, 5)"/>
    <path d="M 0,512 L 256,256" stroke="#C8102E" stroke-width="28" stroke-dasharray="0" transform="translate(-10, -5)"/>
    <!-- White cross (St George broad) -->
    <path d="M 256,0 L 256,512 M 0,256 L 512,256" stroke="#FFFFFF" stroke-width="142"/>
    <!-- Red cross (St George) -->
    <path d="M 256,0 L 256,512 M 0,256 L 512,256" stroke="#C8102E" stroke-width="85"/>
  </g>
</svg>
